<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/login.css">
<title>Вход - EduSpace</title>
</head>
<body>
  <div class="login-wrapper">

    <aside class="brand-side">
      <div class="brand-content">
        <div class="brand-logo">
          <img src="assets/logo.png" alt="EduSpace">
        </div>
        <p class="tagline">Образовательное пространство для учителей и учеников</p>

        <div class="brand-features">
          <div class="brand-feature">
            <div class="feature-icon">
              <svg>
                <use href="assets/icons.svg#book-icon"/>
              </svg>
            </div>
            Создавайте классы и уроки
          </div>
          <div class="brand-feature">
            <div class="feature-icon">
              <svg>
                <use href="assets/icons.svg#tasks-icon"/>
              </svg>
            </div>
            Выдавайте и проверяйте задания
          </div>
          <div class="brand-feature">
            <div class="feature-icon">
              <svg>
                <use href="assets/icons.svg#students-icon"/>
              </svg>
            </div>
            Объединяйте учеников в классы
          </div>
        </div>
      </div>
    </aside>

    <div class="form-side">
      <div class="form-container">
        <div class="form-header">
          <h2>Добро пожаловать!</h2>
          <p>Войдите в свой аккаунт, чтобы продолжить</p>
        </div>

        <form action="classes.html" method="get">
          <div class="form-group">
            <label for="email">Электронная почта</label>
            <div class="input-wrapper">
              <svg class="input-icon">
                <use href="assets/icons.svg#email-icon"/>
              </svg>
              <input id="email" type="email" placeholder="teacher@school.ru" value="teacher@school.ru">
            </div>
          </div>

          <div class="form-group">
            <label for="password">Пароль</label>
            <div class="input-wrapper">
              <svg class="input-icon">
                  <use href="assets/icons.svg#password-icon"/>
              </svg>
              <input id="password" type="password" placeholder="••••••••" value="password123">
            </div>
          </div>

          <div class="form-options">
            <label class="remember">
              <input type="checkbox" checked>
              Запомнить меня
            </label>
            <a href="#">Забыли пароль?</a>
          </div>

          <button type="submit" class="btn-primary">Войти</button>
        </form>

        <div class="divider">
          <div class="divider-line"></div>
          <div class="divider-text">или</div>
          <div class="divider-line"></div>
        </div>

        <div class="footer-text">
          Нет аккаунта? <a href="#">Зарегистрироваться</a>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
